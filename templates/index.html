<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Downloader — Fast, Private, Free</title>
    <meta name="description" content="Download YouTube videos and audio in the highest quality. No ads, no tracking, completely private.">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0a0a0a; font-family: system-ui, -apple-system, sans-serif; }

        .nav-glass {
            background: rgba(10,10,10,0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.07);
        }

        .nav-link {
            color: #71717a;
            font-size: 0.875rem;
            font-weight: 500;
            transition: color 0.2s;
        }
        .nav-link:hover { color: #fff; }
        .nav-link.active { color: #fff; }

        .card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
        }

        .input-field {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            transition: border-color 0.2s;
            width: 100%;
        }
        .input-field:focus {
            outline: none;
            border-color: rgba(220,38,38,0.7);
        }
        .input-field::placeholder { color: #52525b; }
        select.input-field option { background: #111; }

        .btn-red {
            background: #dc2626;
            transition: background 0.2s, transform 0.1s;
        }
        .btn-red:hover { background: #b91c1c; }
        .btn-red:active { transform: scale(0.98); }

        .badge {
            background: rgba(220,38,38,0.1);
            border: 1px solid rgba(220,38,38,0.25);
            color: #f87171;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.07em;
            text-transform: uppercase;
        }

        .footer-link { color: #52525b; font-size: 0.8rem; transition: color 0.2s; }
        .footer-link:hover { color: #a1a1aa; }

        .spinner {
            width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.25);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen text-white">

    <!-- Navbar -->
    <nav class="nav-glass sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-5 h-14 flex items-center justify-between">
            <a href="/" class="flex items-center gap-2 font-bold text-white tracking-tight">
                <span class="bg-red-600 text-white text-xs font-bold px-2 py-1 rounded-md">YT</span>
                Downloader
            </a>
            <div class="flex items-center gap-7">
                <a href="/" class="nav-link active">Home</a>
                <a href="/about" class="nav-link">About</a>
                <a href="/faq" class="nav-link">FAQ</a>
                <a href="/contact" class="nav-link">Contact</a>
            </div>
        </div>
    </nav>

    <!-- Hero -->
    <section class="max-w-2xl mx-auto px-5 pt-16 pb-4 text-center">
        <div class="inline-flex items-center gap-2 badge px-3 py-1.5 rounded-full mb-6">
            <span class="w-1.5 h-1.5 bg-red-500 rounded-full inline-block"></span>
            Powered by yt-dlp
        </div>
        <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight leading-tight mb-4">
            Download YouTube<br>
            <span class="text-red-500">videos &amp; audio</span>
        </h1>
        <p class="text-zinc-400 text-base max-w-sm mx-auto">
            Fast, private, no ads. Up to 4K quality. No sign-up required.
        </p>
    </section>

    <!-- Downloader Form -->
    <section class="max-w-xl mx-auto px-5 py-8">
        <div class="card rounded-2xl p-7">
            <form action="/download" method="POST" id="dl-form">

                <!-- URL -->
                <div class="mb-5">
                    <label class="block text-xs font-semibold text-zinc-500 uppercase tracking-widest mb-2">YouTube URL</label>
                    <input
                        type="text"
                        name="url"
                        placeholder="https://www.youtube.com/watch?v=..."
                        required
                        autocomplete="off"
                        class="input-field px-4 py-3 rounded-xl text-sm">
                </div>

                <!-- Format + Quality -->
                <div class="grid grid-cols-2 gap-4 mb-5">
                    <div>
                        <label class="block text-xs font-semibold text-zinc-500 uppercase tracking-widest mb-2">Format</label>
                        <select name="option" class="input-field px-4 py-3 rounded-xl text-sm cursor-pointer">
                            <option value="best">Video + Audio</option>
                            <option value="video">Video Only</option>
                            <option value="audio">Audio Only (MP3)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-zinc-500 uppercase tracking-widest mb-2">Quality</label>
                        <select name="resolution" class="input-field px-4 py-3 rounded-xl text-sm cursor-pointer">
                            <option value="best">Best Available</option>
                            <option value="2160">4K — 2160p</option>
                            <option value="1440">2K — 1440p</option>
                            <option value="1080" selected>Full HD — 1080p</option>
                            <option value="720">HD — 720p</option>
                            <option value="480">SD — 480p</option>
                        </select>
                    </div>
                </div>

                <!-- Subtitles toggle -->
                <label class="flex items-center gap-3 mb-6 cursor-pointer select-none">
                    <input type="checkbox" name="subtitles" value="yes" class="w-4 h-4 accent-red-600 rounded">
                    <span class="text-sm text-zinc-400">Embed English subtitles</span>
                </label>

                <!-- Submit -->
                <button type="submit" id="dl-btn" class="btn-red w-full py-3.5 rounded-xl font-semibold text-sm flex items-center justify-center gap-2">
                    <div class="spinner" id="spinner"></div>
                    <span id="btn-text">Download Now</span>
                </button>

            </form>
        </div>

        <p class="text-center text-xs text-zinc-700 mt-4">
            For personal use only. Respect copyright laws.
        </p>
    </section>

    <!-- Feature pills -->
    <section class="max-w-xl mx-auto px-5 pb-20">
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
            <div class="card rounded-xl px-4 py-3 text-center">
                <div class="text-white font-bold text-sm">4K</div>
                <div class="text-zinc-600 text-xs mt-0.5">Max Quality</div>
            </div>
            <div class="card rounded-xl px-4 py-3 text-center">
                <div class="text-white font-bold text-sm">MP3</div>
                <div class="text-zinc-600 text-xs mt-0.5">Audio Export</div>
            </div>
            <div class="card rounded-xl px-4 py-3 text-center">
                <div class="text-white font-bold text-sm">Zero</div>
                <div class="text-zinc-600 text-xs mt-0.5">Ads</div>
            </div>
            <div class="card rounded-xl px-4 py-3 text-center">
                <div class="text-white font-bold text-sm">Free</div>
                <div class="text-zinc-600 text-xs mt-0.5">Always</div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer style="border-top: 1px solid rgba(255,255,255,0.06);">
        <div class="max-w-5xl mx-auto px-5 py-7 flex flex-col md:flex-row items-center justify-between gap-4">
            <span class="text-xs text-zinc-700">© 2026 YT Downloader</span>
            <div class="flex items-center gap-6">
                <a href="/privacy" class="footer-link">Privacy</a>
                <a href="/terms" class="footer-link">Terms</a>
                <a href="/faq" class="footer-link">FAQ</a>
                <a href="/contact" class="footer-link">Contact</a>
            </div>
        </div>
    </footer>

    <script>
        const form = document.getElementById('dl-form');
        const btn = document.getElementById('dl-btn');
        const spinner = document.getElementById('spinner');
        const btnText = document.getElementById('btn-text');

        form.addEventListener('submit', function () {
            spinner.style.display = 'block';
            btnText.textContent = 'Preparing...';
            btn.disabled = true;
            btn.style.opacity = '0.7';
            setTimeout(function () {
                spinner.style.display = 'none';
                btnText.textContent = 'Download Now';
                btn.disabled = false;
                btn.style.opacity = '1';
            }, 15000);
        });
    </script>

</body>
</html>
