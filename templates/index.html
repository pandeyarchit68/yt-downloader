<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Downloader - Fast & Private</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
        }
        .hero-bg {
            background: radial-gradient(circle at center, rgba(239, 68, 68, 0.15), transparent 70%);
        }
        .nav-link {
            position: relative;
            transition: all 0.3s;
        }
        .nav-link:after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -2px;
            left: 0;
            background: #ef4444;
            transition: width 0.3s;
        }
        .nav-link:hover:after, .nav-link.active:after {
            width: 100%;
        }
    </style>
</head>
<body class="min-h-screen text-white">

    <!-- Navbar -->
    <nav class="sticky top-0 z-50 bg-zinc-950/95 backdrop-blur-md border-b border-zinc-800">
        <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="/" class="flex items-center gap-2 font-bold text-2xl">
                <span class="text-red-500">▶</span> YT Downloader
            </a>
            <div class="flex items-center gap-8 text-sm font-medium">
                <a href="/" class="nav-link active text-white">Home</a>
                <a href="/about" class="nav-link">About</a>
                <a href="/faq" class="nav-link">FAQ</a>
                <a href="/contact" class="nav-link">Contact</a>
            </div>
        </div>
    </nav>

    <div class="max-w-3xl mx-auto pt-16 px-6 pb-20">
        <div class="text-center mb-12 hero-bg py-8 rounded-3xl">
            <h1 class="text-6xl font-black mb-4 tracking-tighter">
                Download YouTube<br><span class="text-red-500">Videos</span> & Audio
            </h1>
            <p class="text-xl text-gray-400 max-w-md mx-auto">
                Fast • No Ads • Private • High Quality
            </p>
        </div>

        <!-- Form -->
        <form action="/download" method="POST" class="bg-zinc-900/70 backdrop-blur-xl border border-zinc-700 rounded-3xl p-10 shadow-2xl">

            <div class="mb-8">
                <input 
                    type="text" 
                    name="url" 
                    id="url-input"
                    placeholder="Paste YouTube link here..."
                    required
                    class="w-full px-6 py-5 bg-zinc-800 border border-zinc-700 rounded-2xl text-lg focus:outline-none focus:border-red-500 transition-all">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <div>
                    <label class="block text-sm text-gray-400 mb-2">Format</label>
                    <select name="option" class="w-full px-5 py-4 bg-zinc-800 border border-zinc-700 rounded-2xl focus:outline-none focus:border-red-500">
                        <option value="best">🎥 Best Video + Audio</option>
                        <option value="video">🎞️ Video Only</option>
                        <option value="audio">🎵 Audio Only (MP3)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm text-gray-400 mb-2">Quality</label>
                    <select name="resolution" class="w-full px-5 py-4 bg-zinc-800 border border-zinc-700 rounded-2xl focus:outline-none focus:border-red-500">
                        <option value="best">Best Available</option>
                        <option value="2160">4K (2160p)</option>
                        <option value="1440">2K (1440p)</option>
                        <option value="1080" selected>1080p (Full HD)</option>
                        <option value="720">720p (HD)</option>
                    </select>
                </div>
            </div>

            <div class="mb-8 flex items-center gap-3">
                <input type="checkbox" name="subtitles" value="yes" class="w-5 h-5 accent-red-600">
                <span class="text-gray-300">Embed English Subtitles</span>
            </div>

            <button type="submit"
                class="w-full bg-red-600 hover:bg-red-500 py-5 rounded-2xl text-xl font-bold flex items-center justify-center gap-3 transition-all active:scale-[0.97]">
                ⬇️ Download Now
            </button>
        </form>

        <p class="text-center text-xs text-gray-500 mt-10">
            For personal & educational use only • Respect copyright
        </p>
    </div>
</body>
</html>
